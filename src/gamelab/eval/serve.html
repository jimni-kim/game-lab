<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 에이전트 데모</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #deded9; --accent: #2a62d6; --mine: #2a62d6; --mine-ink: #fff; --theirs: #efefec; --stop: #c4392f; --ok: #2c8a4b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --panel: #1f1f22; --ink: #ececef; --muted: #9a9aa2; --line: #34343a; --accent: #6d9bff; --mine: #3a64c8; --mine-ink: #fff; --theirs: #2a2a2f; --stop: #ff6b5f; --ok: #5fcb84; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 1320px; height: 100vh; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); grid-template-rows: auto minmax(0, 1fr); }
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  #state { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  #state.playing { color: var(--ok); border-color: var(--ok); }
  .game { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .screen { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .screen img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .screen p { color: var(--muted); }
  .screen [hidden] { display: none; }
  .device { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; text-align: center; }
  .device p { margin: 0; }
  .device button { padding: 10px 18px; }
  .screen img.touchable { touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .touch { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); }
  .touch[hidden] { display: none; }
  .touch span { flex: 1; min-width: 0; }
  .touch button { padding: 6px 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  summary { cursor: pointer; padding: 8px 12px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0 12px 8px; max-height: 30vh; overflow: auto; }
  li { padding: 4px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  li:last-child { border-bottom: 0; }
  li time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  li.end { font-weight: 600; }
  li.bad { color: var(--stop); }
  .chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #talk { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #talk .hint { color: var(--muted); font-size: 13px; margin: auto 0; text-align: center; }
  .bubble { max-width: 88%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble small { display: block; margin-top: 2px; font-size: 11px; opacity: .65; }
  .mine { align-self: flex-end; background: var(--mine); color: var(--mine-ink); border-bottom-right-radius: 4px; }
  .theirs { align-self: flex-start; background: var(--theirs); border-bottom-left-radius: 4px; }
  .theirs.progress { font-size: 13px; color: var(--muted); background: transparent; border: 1px dashed var(--line); }
  .theirs.refused { color: var(--stop); }
  .theirs.end { font-weight: 600; }
  .waiting { align-self: flex-start; color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  textarea { flex: 1; min-width: 0; resize: none; height: 44px; max-height: 120px; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  button { font: inherit; padding: 0 16px; border-radius: 10px; border: 0; color: #fff; background: var(--accent); cursor: pointer; white-space: nowrap; }
  button#stop { background: var(--stop); }
  button:disabled { opacity: .4; cursor: default; }
  @media (max-width: 820px) {
    main { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    .screen { flex: none; height: 56vh; }
    .chat { height: 70vh; }
    ol { max-height: 40vh; }
  }
</style>
</head>
<body>
<main>
  <header><h1>게임 에이전트 데모</h1><span id="state">연결 중</span></header>
  <section class="game">
    <div class="screen"><img id="screen" alt="게임 화면" hidden><p id="empty">아직 화면이 없습니다</p>
      <div class="device" id="off" hidden><p>에뮬레이터가 꺼져 있습니다</p><button id="power" type="button">에뮬레이터 켜기</button></div>
      <p id="starting" hidden>에뮬레이터를 켜는 중입니다(1분쯤 걸립니다)</p></div>
    <div class="touch" id="touchbar" hidden><span>화면을 눌러 조작할 수 있습니다</span>
      <button id="back" type="button">뒤로</button><button id="home" type="button">홈</button></div>
    <details id="activity"><summary>활동 <span id="count"></span></summary><ol id="log"></ol></details>
  </section>
  <section class="chat">
    <div id="talk"><p class="hint" id="hint">예: https://… 에서 이 퍼즐을 끝까지 풀어줘 · 퍼즐 앱에서 Fifteen 끝까지 · 판이 도는 중에는 "어디까지 했어?"</p></div>
    <form id="ask">
      <textarea id="words" maxlength="2000" rows="1" placeholder="에이전트에게 말하기"></textarea>
      <button id="send" type="submit">보내기</button>
      <button id="stop" type="button" disabled>중지</button>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), talk = $("talk"), state = $("state"), screen = $("screen");
  const hint = $("hint");
  let shown = null, playing = false, logged = 0, waiting = null, device = "none", framed = false, touch = false;

  const clock = (at) => new Date((at || Date.now() / 1000) * 1000).toLocaleTimeString();
  const say = (text, kind, at) => {
    const item = document.createElement("li");
    if (kind) item.className = kind;
    const time = document.createElement("time");
    time.textContent = clock(at);
    item.append(time, text);
    log.append(item);
    log.scrollTop = log.scrollHeight;
    $("count").textContent = `(${++logged})`;
    return item;
  };
  const near = () => talk.scrollHeight - talk.scrollTop - talk.clientHeight < 80;
  const bubble = (text, side, about, at) => {
    hint.remove();
    const follow = near();
    const item = document.createElement("div");
    item.className = `bubble ${side}` + (about ? ` ${about}` : "");
    const when = document.createElement("small");
    when.textContent = clock(at);
    item.append(text, when);
    if (waiting && side === "theirs") { waiting.remove(); waiting = null; }
    talk.append(item);
    if (follow || side === "mine") talk.scrollTop = talk.scrollHeight;
  };
  const wait = () => {
    if (waiting) return;
    waiting = document.createElement("div");
    waiting.className = "waiting";
    waiting.textContent = "…";
    talk.append(waiting);
    talk.scrollTop = talk.scrollHeight;
  };
  const goal = (g) => g.objective === "reach_value" ? `${g.target_value}까지` : g.objective === "actions" ? `${g.target_value}수`
    : g.objective === "levels" ? `레벨 ${g.target_value}개` : "끝까지";
  const reasons = { busy: "다른 판이 도는 중", day_limit: "오늘 판 수 한도", chat_limit: "오늘 대화 한도", words: "말이 비었거나 너무 김",
                    no_game: "주소나 설치된 앱을 찾지 못함", web_only: "지금은 웹 주소가 있는 요청만 받음", not_public: "공개 주소가 아님", in_use: "다른 실행이 기기를 쓰는 중", idle: "도는 판이 없음",
                    touch_off: "서버가 화면 조작을 받지 않음", playing: "판이 도는 중", device_off: "기기가 켜져 있지 않음",
                    input: "보낸 값이 맞지 않음", failed: "기기에 보내지 못함" };
  // a refusal of an input from the screen: "busy" there is the input before it still on its way, not a game
  const touchReasons = { ...reasons, busy: "앞의 입력이 아직 가는 중" };
  const progress = (e) => e.what === "identified" ? `식별: ${e.falling ? "떨어지는 블록" : (e.candidates || []).join(", ") || "계열 없음"}`
    : e.what === "taken" ? `계열 ${e.again ? "다시 " : ""}잡음: ${e.family}` : e.what === "let_go" ? `계열 놓음: ${e.family} (${e.why})`
    : e.what === "falling" ? `조각 ${e.pieces} · 줄 ${e.lines}` : e.what === "part" ? `부분 ${e.number} 끝: ${e.outcome}` + (e.wanted ? ` · ${e.won}/${e.wanted} 깸, ${e.lost} 짐` : "")
    : e.what;
  let last = null;

  const touchable = () => touch && device === "on" && !playing && framed;

  // the screen's place: a game's frames while one is played (a page's are the browser's), else the device as it is
  const render = () => {
    const idle = !playing && (device === "off" || device === "starting");
    screen.hidden = idle || !framed;
    $("empty").hidden = idle || framed;
    $("off").hidden = !(idle && device === "off");
    $("starting").hidden = !(idle && device === "starting");
    // the screen takes a person's inputs only when the server says so (`--touch`), the device is on and no game is played
    const takes = touchable();
    screen.classList.toggle("touchable", takes);
    $("touchbar").hidden = !takes;
  };

  const setState = (event) => {
    playing = event.state === "playing";
    if (event.device) device = event.device;
    touch = event.touch === true;
    if (!playing && (device === "off" || device === "starting")) framed = false;
    render();
    state.textContent = playing ? "도는 중" : `대기 · 오늘 ${event.left_today}판 남음`;
    state.className = playing ? "playing" : "";
    $("stop").disabled = !playing;
  };

  const told = (event) => {
    switch (event.kind) {
      case "status": setState(event); break;
      case "said": bubble(event.words, "mine", "", event.at); wait(); break;
      case "reply": bubble(event.text, "theirs", event.about, event.at); break;
      case "sorted": break;
      case "asked": log.replaceChildren(); logged = 0; last = null; say(`요청: ${event.words}`, "", event.at); break;
      case "understood": say(event.url ? `웹: ${event.url} · ${goal(event.goal)}` : `앱: ${event.app} · ${goal(event.goal)}`
                              + (event.hint ? ` · ${event.hint}` : ""), "", event.at); break;
      case "opening": say(event.where === "emulator" ? "에뮬레이터를 켜는 중" : event.where === "web" ? "페이지를 여는 중" : `앱을 여는 중 (${event.app})`, "", event.at); break;
      case "progress": {
        // a falling game's pieces come one by one: one line, updated
        if (event.what === "falling" && last && last.dataset.what === "falling") { last.lastChild.textContent = progress(event); break; }
        last = say(progress(event), "", event.at); last.dataset.what = event.what; break;
      }
      case "seen": break;
      case "sending": last = null; say(`수 ${event.number}: ${event.input} ${JSON.stringify(event.where)}`, "", event.at); break;
      case "sent": break;
      case "stopping": say("중지하는 중", "", event.at); break;
      case "result": {
        const tokens = event.tokens ? ` · 입력 토큰 ${event.tokens.input}` : "";
        say(`끝: ${event.outcome} (${event.reason}) · ${event.actions ?? "?"}수 · ${event.seconds ?? "?"}초${tokens}`
            + (event.family ? ` · ${event.family}` : "") + (event.generations != null ? ` · 어댑터 ${event.generations}번` : ""), "end", event.at);
        break;
      }
      case "refused": say(`받지 않음: ${reasons[event.reason] || event.reason}`, "bad", event.at); break;
      case "error": say(`오류: ${event.detail}`, "bad", event.at); break;
      case "touched": say(`직접 누름: ${event.input}` + (event.key ? ` (${event.key})` : ""), "", event.at); break;
    }
  };

  const frame = (blob) => {
    const url = URL.createObjectURL(blob);
    screen.onload = () => { if (shown) URL.revokeObjectURL(shown); shown = url; };
    screen.src = url;
    framed = true;
    render();
  };

  const connect = () => {
    const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    socket.binaryType = "blob";
    // everything is sent again on a new connection: what was shown is cleared first
    socket.onopen = () => { talk.replaceChildren(hint); log.replaceChildren(); logged = 0; last = null; waiting = null; };
    socket.onmessage = (message) => typeof message.data === "string" ? told(JSON.parse(message.data)) : frame(message.data);
    socket.onclose = () => { state.textContent = "연결 끊김, 다시 연결 중"; state.className = ""; setTimeout(connect, 2000); };
  };

  const post = async (path, body) => {
    const answer = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (answer.status === 401) { bubble("접근 토큰이 없습니다: 서버가 출력한 주소로 다시 여세요", "theirs", "refused"); return; }
    const said = await answer.json().catch(() => ({}));
    if (said.refused) bubble(`받지 않음: ${reasons[said.refused] || said.refused}`, "theirs", "refused");
  };

  $("ask").addEventListener("submit", (event) => {
    event.preventDefault();
    const words = $("words").value.trim();
    if (!words) return;
    $("words").value = "";
    post("/say", { words });
  });
  $("words").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); $("ask").requestSubmit(); }
  });
  $("stop").addEventListener("click", () => post("/stop"));

  // a person's input on the device, sent from the screen; a refusal is a line in the log
  const send = async (body) => {
    try {
      const answer = await fetch("/touch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (answer.status === 401) { say("받지 않음(누름): 접근 토큰이 없음", "bad"); return; }
      const said = await answer.json().catch(() => ({}));
      if (said.refused) say(`받지 않음(누름): ${touchReasons[said.refused] || said.refused}`, "bad");
      else if (!answer.ok) say(`받지 않음(누름): ${answer.status}`, "bad");
    } catch (error) { say("받지 않음(누름): 연결 안 됨", "bad"); }
  };
  // a press that moves less than this share of the screen's width is a tap; one held longer than LONG_MS is a long press
  const STILL = 0.02, LONG_MS = 500;
  let down = null;
  const share = (event, box) => [Math.min(1, Math.max(0, (event.clientX - box.left) / box.width)),
                                 Math.min(1, Math.max(0, (event.clientY - box.top) / box.height))];
  screen.addEventListener("dragstart", (event) => event.preventDefault());
  screen.addEventListener("pointerdown", (event) => {
    if (!touchable() || down || (event.pointerType === "mouse" && event.button !== 0)) return;
    event.preventDefault();
    const box = screen.getBoundingClientRect();
    if (!box.width || !box.height) return;
    down = { id: event.pointerId, box, at: share(event, box), x: event.clientX, y: event.clientY, t: performance.now() };
    try { screen.setPointerCapture(event.pointerId); } catch (error) { /* the pointer is gone already */ }
  });
  screen.addEventListener("pointerup", (event) => {
    if (!down || event.pointerId !== down.id) return;
    const was = down;
    down = null;
    if (!touchable()) return;
    const ms = Math.round(performance.now() - was.t);
    const moved = Math.hypot(event.clientX - was.x, event.clientY - was.y);
    const [x, y] = was.at;
    if (moved <= STILL * was.box.width) {
      send(ms > LONG_MS ? { kind: "tap", x, y, ms } : { kind: "tap", x, y });
    } else {
      const [x1, y1] = share(event, was.box);
      send({ kind: "swipe", x0: x, y0: y, x1, y1, ms });
    }
  });
  screen.addEventListener("pointercancel", () => { down = null; });
  $("back").addEventListener("click", () => send({ kind: "key", key: "back" }));
  $("home").addEventListener("click", () => send({ kind: "key", key: "home" }));
  $("power").addEventListener("click", () => { $("power").disabled = true; post("/emulator").finally(() => { $("power").disabled = false; }); });
  connect();
})();
</script>
</body>
</html>
