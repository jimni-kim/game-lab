[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "game-lab"
version = "0.1.0"
description = "Standalone game agent harness: registered rule models and solvers, per-site adapters, web and Android surfaces"
requires-python = ">=3.14"
dependencies = ["pillow==13.0.0", "jsonschema>=4.23", "playwright>=1.49", "httpx>=0.27"]

[project.optional-dependencies]
# the tests drive the demo page's server and a local page server with aiohttp
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiohttp>=3.11"]
# the demo page (`python -m gamelab.eval serve`)
demo = ["aiohttp>=3.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/gamelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
